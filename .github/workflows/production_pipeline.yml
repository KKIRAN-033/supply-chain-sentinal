name: CI Pipeline (Vercel & Render Ready)

on:
  push:
    branches: [main, master, production]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          SCS_ENVIRONMENT: test
          PYTHONPATH: backend:.
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short || (
            echo "::error title=Pytest Error::Pytest execution failed"
            python -m pytest tests/ -v --tb=short 2>&1 | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          )

  frontend-build:
    name: Frontend Build & Type Check (Vercel Ready)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Check & Vite Production Build
        run: |
          cd frontend
          npm run build
